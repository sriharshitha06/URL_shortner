name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  container-smoke:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set deployment version
        run: echo "APP_VERSION=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        run: docker compose -f infra/docker-compose.yml up -d postgres

      - name: Build and deploy app container
        run: docker compose -f infra/docker-compose.yml up -d --build app
        env:
          APP_IMAGE: caw-express-app:${{ github.sha }}
          APP_VERSION: ${{ github.sha }}
          APP_ENV: production
          SERVICE_NAME: url-shortener
          LOG_LEVEL: info
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/linkops
          API_KEYS: '{"dev-key-a":"A","dev-key-b":"B"}'
          USE_IN_MEMORY_STORE: "false"

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ready)
            if [ "$status" = "200" ]; then
              echo "Readiness passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i: /ready returned $status"
            sleep 2
          done
          echo "Readiness failed"
          exit 1

      - name: Verify deployed version and metrics
        run: npm run module-08:deploy-verify
        env:
          BASE_URL: http://localhost:3000
          APP_EXPECTED_VERSION: ${{ github.sha }}
          APP_EXPECTED_STORE: postgres

      - name: Stop containers
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
